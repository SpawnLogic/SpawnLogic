<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} · SpawnLogic</title>

  <meta
    name="description"
    content="{{ site.description }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >
</head>

<body>

  <div class="site-shell">

    <header class="site-header">

      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">&gt;_</span>
        <span>SpawnLogic</span>
      </a>

      <nav class="site-nav">
        <a href="#stack">Stack</a>
        <a href="#focus">Focus</a>
        <a href="#contact">Contact</a>
        <a
          class="nav-github"
          href="https://github.com/SpawnLogic"
          target="_blank"
          rel="noopener"
        >
          GitHub ↗
        </a>
      </nav>

    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">

      <span>© {{ 'now' | date: "%Y" }} SpawnLogic</span>

      <span class="footer-status">
        <span class="status-dot"></span>
        Building in public
      </span>

    </footer>

  </div>

</body>
</html>
